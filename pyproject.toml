[project]
name = "youtube-tools-mcp"
version = "0.1.0"
description = "MCP server for YouTube transcripts, text cleanup, and frame extraction"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12.0,<2.0.0",
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
api = ["google-api-python-client"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
youtube-tools-mcp = "youtube_tools_mcp.server:main"
youtube-tools-mcp-oauth = "youtube_tools_mcp.youtube.oauth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_tools_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
